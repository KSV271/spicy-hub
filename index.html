
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spicy Hub</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff8f0;
  color: #222;
}

header {
  background: #ff5722;
  color: white;
  text-align: center;
  padding: 25px;
}

header h1 {
  margin: 0;
}

.menu {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  padding: 20px;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 15px;
  box-shadow: 0 3px 12px #ddd;
  text-align: center;
}

.card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  border-radius: 10px;
}

.card button, .order-btn, .qty button {
  background: #ff5722;
  color: white;
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
}

.card button:hover, .order-btn:hover {
  background: #e64a19;
}

.cart {
  background: white;
  margin: 20px;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 3px 12px #ddd;
}

.cart-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid #ddd;
  padding: 12px 0;
  flex-wrap: wrap;
}

.qty {
  display: flex;
  align-items: center;
  gap: 10px;
}

.qty button {
  padding: 6px 12px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border: 1px solid #ccc;
  border-radius: 8px;
}

.order-btn {
  width: 100%;
  padding: 15px;
  font-size: 16px;
}

</style>
</head>

<body>

<header>
  <h1>🍔 Spicy Hub</h1>
  <p>Delicious Food, Delivered Fresh</p>
</header>

<section class="menu">

<div class="card">
<img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=500&q=80">
<h3>Classic Burger</h3>
<p>₹120</p>
<button onclick="addToCart('Classic Burger',120)">Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=500&q=80">
<h3>Cheese Pizza</h3>
<p>₹250</p>
<button onclick="addToCart('Cheese Pizza',250)">Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1544145945-f90425340c7e?auto=format&fit=crop&w=500&q=80">
<h3>Cold Drink</h3>
<p>₹40</p>
<button onclick="addToCart('Cold Drink',40)">Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1585032226651-759b368d7246?auto=format&fit=crop&w=500&q=80">
<h3>Veg Noodles</h3>
<p>₹150</p>
<button onclick="addToCart('Veg Noodles',150)">Add to Cart</button>
</div>

</section>

<section class="cart">
<h2>🛒 Your Cart</h2>

<div id="cartItems"></div>

<h3 id="total">Total: ₹0</h3>

<input id="customerName" placeholder="Your Name">
<input id="tableNumber" placeholder="Table Number">

<button class="order-btn" onclick="placeOrder()">
Place Order
</button>

</section>

<script>

let cart = [];

function addToCart(name, price) {
  let item = cart.find(i => i.name === name);

  if(item) {
    item.qty++;
  } else {
    cart.push({name, price, qty: 1});
  }

  updateCart();
}

function changeQty(name, change) {
  let item = cart.find(i => i.name === name);

  if(!item) return;

  item.qty += change;

  if(item.qty <= 0) {
    cart = cart.filter(i => i.name !== name);
  }

  updateCart();
}

function updateCart() {
  let cartDiv = document.getElementById("cartItems");
  let total = 0;

  cartDiv.innerHTML = "";

  cart.forEach(item => {
    total += item.price * item.qty;

    cartDiv.innerHTML += `
      <div class="cart-item">
        <div>
          <strong>${item.name}</strong><br>
          ₹${item.price} x ${item.qty}
        </div>

        <div class="qty">
          <button onclick="changeQty('${item.name}',-1)">−</button>
          <span>${item.qty}</span>
          <button onclick="changeQty('${item.name}',1)">+</button>
        </div>
      </div>
    `;
  });

  document.getElementById("total").innerText = "Total: ₹" + total;
}
function placeOrder() {
  if(cart.length === 0) {
    alert("Your cart is empty!");
    return;
  }

  let name = document.getElementById("customerName").value;
  let table = document.getElementById("tableNumber").value;

  if(!name || !table) {
    alert("Please enter your name and table number.");
    return;
  }

  let total = cart.reduce((sum,item) => sum + item.price * item.qty, 0);

  let message = "New Order - Spicy Hub\n";
  message += "Name: " + name + "\n";
  message += "Table: " + table + "\n\n";

  cart.forEach(item => {
    message += item.name + " x " + item.qty + " = ₹" + (item.price * item.qty) + "\n";
  });

  message += "\nTotal: ₹" + total;

  let phone = "7838556325";
  let url = "https://wa.me/" + phone + "?text=" + encodeURIComponent(message);

  window.open(url, "_blank");
}

</script>

</body>
</html>
